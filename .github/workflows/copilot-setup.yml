---
name: "Copilot Setup"
run-name: "Agentic Workflows - Setup for Copilot Agent"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup.yml

jobs:
  copilot-setup:
    name: Setup for Copilot Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@ba6380cc6e5be5d21677bebe04d52fb48e3abec7 # v0.81.6
        with:
          version: v0.81.6
