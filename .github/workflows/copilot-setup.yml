---
name: "Copilot Setup"
run-name: "Agentic Workflows - Setup for Copilot Agent"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup.yml

jobs:
  copilot-setup:
    name: Setup for Copilot Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@f3ca20900e2363607992fb61b46fc687d4b56ba3 # v0.84.0
        with:
          version: v0.81.6
